name: Build OpenWrt for EMB-3531

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Initialization environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex g++ gawk gcc-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev swig libpython3-dev

      - name: Clone source code
        run: |
          git clone --depth 1 https://github.com/immortalwrt/immortalwrt.git openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply EMB-3531 Patches
        run: |
          mkdir -p openwrt/target/linux/rockchip/patches-5.15/
          cp patches/212-pcie-timeout.patch openwrt/target/linux/rockchip/patches-5.15/999-pcie-timeout-fix.patch
          cp patches/rk3399-emb-3531.dts openwrt/target/linux/rockchip/dts/rockchip/rk3399-emb-3531.dts

      - name: Generate Config
        run: |
          cd openwrt
          echo "CONFIG_TARGET_rockchip=y" > .config
          echo "CONFIG_TARGET_rockchip_armv8=y" >> .config
          echo "CONFIG_TARGET_rockchip_armv8_DEVICE_rockchip_rk3399=y" >> .config
          echo "CONFIG_PACKAGE_kmod-r8125=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-passwall=y" >> .config
          make defconfig

      - name: Download Dl Package
        run: cd openwrt && make download -j8

      - name: Compile
        run: cd openwrt && make -j$(nproc) || make -j1 V=s

      - name: Upload Firmware
        uses: actions/upload-artifact@v3
        with:
          name: EMB-3531-OpenWrt
          path: openwrt/bin/targets/rockchip/armv8/*.img.gz
