name: EMB-3531-DAE-Pro-Based-On-Post

on:
  workflow_dispatch:

permissions: write-all

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v3

      - name: 2. 准备编译环境
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install $(curl -fsSL https://is.gd/depends_ubuntu_2204) dwarves clang llvm
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"

      - name: 3. 克隆源码并添加插件源
        run: |
          git clone $REPO_URL -b $REPO_BRANCH openwrt
          cd openwrt
          echo "src-git kenzo https://github.com/kenzok8/openwrt-packages" >> feeds.conf.default
          echo "src-git small https://github.com/kenzok8/small" >> feeds.conf.default
          ./scripts/feeds update -a
          # 消除冲突
          rm -rf feeds/luci/applications/luci-app-mosdns
          rm -rf feeds/packages/net/mosdns
          rm -rf feeds/luci/themes/luci-theme-argon
          ./scripts/feeds install -a

      - name: 4. 严格按照帖子附件注入补丁 (PCIe 1500ms)
        run: |
          cd openwrt
          # 为所有可能的内核版本创建补丁目录并注入 212 补丁
          for v in 5.15 6.1 6.6; do
            mkdir -p target/linux/rockchip/patches-$v/
            cat > target/linux/rockchip/patches-$v/999-rk3399-pcie-timeout.patch <<EOF
          --- a/drivers/pci/controller/pcie-rockchip-host.c
          +++ b/drivers/pci/controller/pcie-rockchip-host.c
          @@ -336,7 +336,7 @@ static int rockchip_pcie_host_init_port(
           	/* 500ms timeout value should be enough for Gen1/2 training */
           	err = readl_poll_timeout(rockchip->apb_base + PCIE_CLIENT_BASIC_STATUS1,
           				 status, PCIE_LINK_UP(status), 20,
          -				 500 * USEC_PER_MSEC);
          +				 1500 * USEC_PER_MSEC);
           	if (err) {
           		dev_err(dev, "PCIe link training gen1 timeout!\n");
           		goto err_power_off_phy;
          @@ -353,7 +353,7 @@ static int rockchip_pcie_host_init_port(
           
           		err = readl_poll_timeout(rockchip->apb_base + PCIE_CORE_CTRL,
           					 status, PCIE_LINK_IS_GEN2(status), 20,
          -					 500 * USEC_PER_MSEC);
          +					 1500 * USEC_PER_MSEC);
           		if (err)
           			dev_dbg(dev, "PCIe link training gen2 timeout, fall back to gen1!\n");
           	}
          EOF
          done

      - name: 5. 注入附件提供的专用 DTS (EMB-3531)
        run: |
          cd openwrt
          # 修正路径：OpenWrt 的内核设备树覆盖目录通常在 target/linux/rockchip/files/
          mkdir -p target/linux/rockchip/files/arch/arm64/boot/dts/rockchip/
          
          # 直接注入你附件中的 rk3399-emb-3531.dts 核心逻辑
          cat > target/linux/rockchip/files/arch/arm64/boot/dts/rockchip/rk3399-emb-3531.dts <<EOF
          /dts-v1/;
          #include "rk3399.dtsi"
          / {
              model = "Norco EMB-3531";
              compatible = "rockchip,rk3399-emb-3531", "rockchip,rk3399";
              
              vcc3v3_pcie: vcc3v3-pcie-regulator {
                  compatible = "regulator-fixed";
                  enable-active-high;
                  gpio = <&gpio1 17 0>; 
                  regulator-name = "vcc3v3_pcie";
                  regulator-always-on;
                  regulator-boot-on;
              };
          };
          &pcie0 {
              ep-gpios = <&gpio4 25 0>; 
              vpcie3v3-supply = <&vcc3v3_pcie>;
              status = "okay";
          };
          EOF
          
          # 在 Makefile 中注册，参考 212 补丁逻辑
          sed -i '/rk3399-sapphire-excavator.dtb/a \	rk3399-emb-3531.dtb \\' target/linux/rockchip/image/armv8.mk

      - name: 6. 旁路由配置与 DAE 内核开关
        run: |
          cd openwrt
          # 自动化 IP 设置 1.88
          mkdir -p package/base-files/files/etc/uci-defaults
          cat > package/base-files/files/etc/uci-defaults/99-setup <<EOF
          uci set network.lan.proto='static'
          uci set network.lan.ipaddr='192.168.1.88'
          uci set network.lan.netmask='255.255.255.0'
          uci set network.lan.gateway='192.168.1.1'
          uci set network.lan.dns='192.168.1.1'
          uci set dhcp.lan.ignore='1'
          uci set firewall.@defaults[0].forward='ACCEPT'
          uci commit
          EOF

          # .config 核心配置
          echo "CONFIG_TARGET_rockchip=y" >> .config
          echo "CONFIG_TARGET_rockchip_armv8=y" >> .config
          echo "CONFIG_TARGET_rockchip_armv8_DEVICE_rockchip_rk3399-emb-3531=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-daed=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-mosdns=y" >> .config
          echo "CONFIG_PACKAGE_luci-theme-argon=y" >> .config
          # 必须开启 BTF 以支持 dae
          echo "CONFIG_KERNEL_DEBUG_INFO=y" >> .config
          echo "CONFIG_KERNEL_DEBUG_INFO_BTF=y" >> .config
          echo "CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT=y" >> .config
          echo "CONFIG_BPF_SYSCALL=y" >> .config
          
          make defconfig

      - name: 7. 执行编译
        id: compile
        run: |
          cd openwrt
          make download -j8
          make -j$(nproc) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 8. 发布至 Release
        uses: softprops/action-gh-release@v1
        if: steps.compile.outputs.status == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: EMB-3531-STABLE-${{ github.run_id }}
          files: openwrt/bin/targets/rockchip/armv8/*.img.gz
