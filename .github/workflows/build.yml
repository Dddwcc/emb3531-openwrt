name: EMB-3531-DAE-Immortal-SideRouter-Pro

on:
  workflow_dispatch:

permissions: write-all

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v3

      - name: 2. 极致空间清理与环境准备
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup
          sudo docker image prune -a -f
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install $(curl -fsSL https://is.gd/depends_ubuntu_2204) \
          python3-pyelftools dwarves clang llvm swig libelf-dev python3-setuptools
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"

      - name: 3. 克隆源码并同步插件 (ImmortalWrt)
        run: |
          git clone $REPO_URL -b $REPO_BRANCH openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 4. PCIe 链路初始化深度修复 (源码级)
        run: |
          cd openwrt
          # 寻找并强改内核 PCIe 训练超时从 500ms 延长至 2000ms
          find target/linux/rockchip -name "pcie-rockchip-host.c" -exec sed -i 's/500 \* USEC_PER_MSEC/2000 \* USEC_PER_MSEC/g' {} +
          find target/linux/rockchip -name "pcie-rockchip-host.c" -exec sed -i 's/RK_PCIE_LINK_UP_TIMEOUT_MS	500/RK_PCIE_LINK_UP_TIMEOUT_MS	2000/g' {} +

      - name: 5. 注入 EMB-3531 专用设备树与构建节点
        run: |
          cd openwrt
          # 创建设备树目录
          mkdir -p target/linux/rockchip/files/arch/arm64/boot/dts/rockchip/
          # 基于华北工控 V2.2 硬件日志生成的最终 DTS
          cat > target/linux/rockchip/files/arch/arm64/boot/dts/rockchip/rk3399-emb-3531.dts <<EOF
          /dts-v1/;
          #include "rk3399-nanopi-r4s.dts"
          / {
              model = "Norco EMB-3531 sidegateway";
              compatible = "rockchip,rk3399-emb-3531", "rockchip,rk3399";
              vcc3v3_pcie: vcc3v3-pcie-regulator {
                  compatible = "regulator-fixed";
                  enable-active-high;
                  gpio = <&gpio1 17 0>; 
                  regulator-name = "vcc3v3_pcie";
                  regulator-always-on;
                  regulator-boot-on;
              };
          };
          &pcie0 {
              ep-gpios = <&gpio4 25 0>; 
              vpcie3v3-supply = <&vcc3v3_pcie>;
              status = "okay";
          };
          EOF
          # 将新设备树注册进 armv8 构建列表，使其生成 .dtb 镜像
          [ -f target/linux/rockchip/image/armv8.mk ] && sed -i '/rk3399-nanopi-r4s/a \	rk3399-emb-3531.dtb \\' target/linux/rockchip/image/armv8.mk

      - name: 6. 旁路由 1.88 预设与网络穿透优化
        run: |
          cd openwrt
          mkdir -p package/base-files/files/etc/uci-defaults
          cat > package/base-files/files/etc/uci-defaults/99-side-gateway <<EOF
          # LAN IP 与 禁用 DHCP
          uci set network.lan.proto='static'
          uci set network.lan.ipaddr='192.168.1.88'
          uci set network.lan.netmask='255.255.255.0'
          uci set network.lan.gateway='192.168.1.1'
          uci set network.lan.dns='192.168.1.1'
          uci set dhcp.lan.ignore='1'
          # 防火墙优化：针对旁路由流量转发
          uci set firewall.@defaults[0].forward='ACCEPT'
          echo "net.bridge.bridge-nf-call-iptables = 0" >> /etc/sysctl.conf
          echo "net.bridge.bridge-nf-call-ip6tables = 0" >> /etc/sysctl.conf
          uci commit
          EOF

      - name: 7. 最终配置写入 (2GB+16GB 冗余版)
        run: |
          cd openwrt
          # 指定硬件为 RK3399 镜像
          echo "CONFIG_TARGET_rockchip=y" >> .config
          echo "CONFIG_TARGET_rockchip_armv8=y" >> .config
          echo "CONFIG_TARGET_rockchip_armv8_DEVICE_rockchip_rk3399-emb-3531=y" >> .config
          
          # 分区设置：给足 2GB 系统空间
          echo "CONFIG_TARGET_KERNEL_PARTSIZE=128" >> .config
          echo "CONFIG_TARGET_ROOTFS_PARTSIZE=2048" >> .config
          
          # 核心功能包
          echo "CONFIG_PACKAGE_luci-app-daed=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-mosdns=y" >> .config
          echo "CONFIG_PACKAGE_luci-theme-argon=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-ttyd=y" >> .config
          
          # dae 运行必须的 eBPF/BTF 内核支持
          echo "CONFIG_KERNEL_DEBUG_INFO_BTF=y" >> .config
          echo "CONFIG_BPF_SYSCALL=y" >> .config
          echo "CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT=y" >> .config
          
          make defconfig

      - name: 8. 执行下载与最终编译
        id: compile
        run: |
          cd openwrt
          make download -j16
          # 优先多线程，失败自动转单线程 V=s 输出调试日志
          make -j$(nproc) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 9. 发布固件至 Release
        uses: softprops/action-gh-release@v1
        if: steps.compile.outputs.status == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: EMB-3531-Immortal-Side-${{ github.run_id }}
          body: |
            ### 华北工控 EMB-3531 (RK3399) 定制固件
            - **网卡**: 驱动 PCIe 8125B (2.0s 延时修复)
            - **IP**: 192.168.1.88 (旁路由模式)
            - **集成**: daed (sing-box), MosDNS, Argon
            - **内核**: 开启 BTF 支持，兼容 eBPF
          files: openwrt/bin/targets/rockchip/armv8/*.img.gz
