name: EMB-3531-DAE-SideRouter-Final

on:
  workflow_dispatch:

permissions: write-all

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v3

      - name: 2. 安装环境与BTF工具
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install $(curl -fsSL https://is.gd/depends_ubuntu_2204) dwarves clang llvm
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"

      - name: 3. 克隆源码并清洗冲突
        run: |
          git clone $REPO_URL -b $REPO_BRANCH openwrt
          cd openwrt
          echo "src-git kenzo https://github.com/kenzok8/openwrt-packages" >> feeds.conf.default
          echo "src-git small https://github.com/kenzok8/small" >> feeds.conf.default
          ./scripts/feeds update -a
          # 彻底清除重复包防止 Error 2
          rm -rf feeds/luci/applications/luci-app-mosdns
          rm -rf feeds/packages/net/mosdns
          rm -rf feeds/luci/themes/luci-theme-argon
          ./scripts/feeds install -a

      - name: 4. 修改内核源码 (强制解决PCIe超时)
        run: |
          cd openwrt
          # 直接修改内核驱动源码，将 500ms 超时改为 2000ms，这是解决识别不到网卡的命门
          find target/linux/rockchip -name "pcie-rockchip-host.c" -exec sed -i 's/500 \* USEC_PER_MSEC/2000 \* USEC_PER_MSEC/g' {} +
          # 针对某些内核版本中定义的宏名进行替换
          find target/linux/rockchip -name "pcie-rockchip-host.c" -exec sed -i 's/RK_PCIE_LINK_UP_TIMEOUT_MS	500/RK_PCIE_LINK_UP_TIMEOUT_MS	2000/g' {} +

      - name: 5. 注入EMB-3531专有设备树
        run: |
          cd openwrt
          # 创建独立的 DTS 文件
          cat > target/linux/rockchip/dts/rockchip/rk3399-emb-3531.dts <<EOF
          /dts-v1/;
          #include "rk3399-nanopi-r4s.dts"
          / {
              model = "Norco EMB-3531 Board";
              compatible = "rockchip,rk3399-emb-3531", "rockchip,rk3399";
              
              /* 强制定义PCIe供电调节器，解决日志中的 regulator found 报错 */
              vcc3v3_pcie: vcc3v3-pcie-regulator {
                  compatible = "regulator-fixed";
                  enable-active-high;
                  gpio = <&gpio1 17 0>; /* GPIO1_C1 = 编号49 (1*32 + 17) */
                  pinctrl-names = "default";
                  pinctrl-0 = <&pcie_pwr_en>;
                  regulator-name = "vcc3v3_pcie";
                  regulator-always-on;
                  regulator-boot-on;
              };
          };
          &pcie0 {
              ep-gpios = <&gpio4 25 0>; /* GPIO4_D1 = 编号153 (4*32+25) */
              vpcie3v3-supply = <&vcc3v3_pcie>;
              status = "okay";
          };
          &pinctrl {
              pcie {
                  pcie_pwr_en: pcie-pwr-en {
                      rockchip,pins = <1 17 0 &pcfg_pull_none>;
                  };
              };
          };
          EOF
          # 将新设备树注册进编译列表
          sed -i '/rk3399-nanopi-r4s/a \	rk3399-emb-3531.dtb \\' target/linux/rockchip/image/armv8.mk

      - name: 6. 旁路由自动化预设 (IP 1.88 / 关闭DHCP)
        run: |
          cd openwrt
          mkdir -p package/base-files/files/etc/uci-defaults
          cat > package/base-files/files/etc/uci-defaults/99-setup <<EOF
          uci set network.lan.proto='static'
          uci set network.lan.ipaddr='192.168.1.88'
          uci set network.lan.netmask='255.255.255.0'
          uci set network.lan.gateway='192.168.1.1'
          uci set network.lan.dns='192.168.1.1'
          uci set dhcp.lan.ignore='1'
          uci set firewall.@defaults[0].forward='ACCEPT'
          uci commit
          EOF

      - name: 7. 写入最终配置 (.config)
        run: |
          cd openwrt
          echo "CONFIG_TARGET_rockchip=y" >> .config
          echo "CONFIG_TARGET_rockchip_armv8=y" >> .config
          echo "CONFIG_TARGET_rockchip_armv8_DEVICE_rockchip_rk3399-emb-3531=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-daed=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-mosdns=y" >> .config
          echo "CONFIG_PACKAGE_luci-theme-argon=y" >> .config
          # dae 必须的内核选项
          echo "CONFIG_KERNEL_DEBUG_INFO=y" >> .config
          echo "CONFIG_KERNEL_DEBUG_INFO_BTF=y" >> .config
          echo "CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT=y" >> .config
          echo "CONFIG_BPF_SYSCALL=y" >> .config
          make defconfig

      - name: 8. 执行编译
        id: compile
        run: |
          cd openwrt
          make download -j8
          make -j$(nproc) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 9. 发布 Release
        uses: softprops/action-gh-release@v1
        if: steps.compile.outputs.status == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: EMB-3531-Final-${{ github.run_id }}
          files: openwrt/bin/targets/rockchip/armv8/*.img.gz
