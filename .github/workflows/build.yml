name: EMB-3531-Final-Build

on:
  workflow_dispatch:

permissions: write-all

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v3

      - name: 2. 清理磁盘并安装依赖
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup
          sudo docker image prune -a -f
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install $(curl -fsSL https://is.gd/depends_ubuntu_2204) dwarves clang llvm
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"

      - name: 3. 克隆源码与插件处理
        run: |
          git clone $REPO_URL -b $REPO_BRANCH openwrt
          cd openwrt
          echo "src-git kenzo https://github.com/kenzok8/openwrt-packages" >> feeds.conf.default
          echo "src-git small https://github.com/kenzok8/small" >> feeds.conf.default
          ./scripts/feeds update -a
          rm -rf feeds/luci/applications/luci-app-mosdns
          rm -rf feeds/packages/net/mosdns
          rm -rf feeds/luci/themes/luci-theme-argon
          ./scripts/feeds install -a

      - name: 4. 自动注入补丁与设备树 (PCIe超时 & 硬件引脚适配)
        run: |
          cd openwrt
          mkdir -p target/linux/rockchip/patches-6.1/
          # 创建PCIe超时补丁 (1500ms)
          cat > target/linux/rockchip/patches-6.1/999-pcie-timeout-fix.patch <<EOF
          --- a/drivers/pci/controller/pcie-rockchip-host.c
          +++ b/drivers/pci/controller/pcie-rockchip-host.c
          @@ -336,7 +336,7 @@ static int rockchip_pcie_host_init_port(
           	/* 500ms timeout value should be enough for Gen1/2 training */
           	err = readl_poll_timeout(rockchip->apb_base + PCIE_CLIENT_BASIC_STATUS1,
           				 status, PCIE_LINK_UP(status), 20,
          -				 500 * USEC_PER_MSEC);
          +				 1500 * USEC_PER_MSEC);
           	if (err) {
           		dev_err(dev, "PCIe link training gen1 timeout!\n");
           		goto err_power_off_phy;
          EOF

          # 创建EMB-3531专用的设备树文件 (基于你提供的 rockchip.dts 核心定义)
          cat > target/linux/rockchip/dts/rockchip/rk3399-emb-3531.dts <<EOF
          /dts-v1/;
          #include "rk3399-nanopi-r4s.dts"
          / {
              model = "Norco EMB-3531 Board";
              compatible = "rockchip,rk3399-emb-3531", "rockchip,rk3399";
          };
          &pcie0 {
              ep-gpios = <&gpio4 0x19 0x00>;
              vpcie3v3-supply = <&vcc3v3_pcie>;
              status = "okay";
          };
          &pinctrl {
              pcie {
                  vcc3v3_pcie_en: vcc3v3-pcie-en {
                      rockchip,pins = <1 0x11 0x00 0xba>;
                  };
              };
          };
          EOF
          # 注册这个新设备树
          sed -i '/rk3399-nanopi-r4s/a \	rk3399-emb-3531.dtb \\' target/linux/rockchip/image/armv8.mk

      - name: 5. 注入旁路由配置 (IP: 1.88 / No DHCP)
        run: |
          cd openwrt
          mkdir -p package/base-files/files/etc/uci-defaults
          cat > package/base-files/files/etc/uci-defaults/99-setup <<EOF
          uci set network.lan.proto='static'
          uci set network.lan.ipaddr='192.168.1.88'
          uci set network.lan.netmask='255.255.255.0'
          uci set network.lan.gateway='192.168.1.1'
          uci set network.lan.dns='192.168.1.1'
          uci set dhcp.lan.ignore='1'
          uci set firewall.@defaults[0].forward='ACCEPT'
          uci commit
          EOF

      - name: 6. 核心配置与 dae 支持
        run: |
          cd openwrt
          echo "CONFIG_TARGET_rockchip=y" >> .config
          echo "CONFIG_TARGET_rockchip_armv8=y" >> .config
          echo "CONFIG_TARGET_rockchip_armv8_DEVICE_rockchip_rk3399-emb-3531=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-daed=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-mosdns=y" >> .config
          echo "CONFIG_PACKAGE_luci-theme-argon=y" >> .config
          echo "CONFIG_KERNEL_DEBUG_INFO_BTF=y" >> .config
          echo "CONFIG_BPF_SYSCALL=y" >> .config
          make defconfig

      - name: 7. 下载软件包
        run: cd openwrt && make download -j8

      - name: 8. 编译
        id: compile
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 9. 发布 Release
        uses: softprops/action-gh-release@v1
        if: steps.compile.outputs.status == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: EMB-3531-Final-${{ github.run_id }}
          files: openwrt/bin/targets/rockchip/armv8/*.img.gz
