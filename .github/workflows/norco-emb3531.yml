name: Norco-EMB3531-RK3399-Pro-SideRouter

on:
  workflow_dispatch:

permissions: write-all

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v3

      - name: 2. Prepare Environment
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup
          sudo docker image prune -a -f
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install $(curl -fsSL https://is.gd/depends_ubuntu_2204) \
          python3-pyelftools dwarves clang llvm swig libelf-dev python3-setuptools bc
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"

      - name: 3. Clone Source & Sync Feeds
        run: |
          git clone $REPO_URL -b $REPO_BRANCH openwrt
          cd openwrt
          echo "src-git kenzo https://github.com/kenzok8/openwrt-packages" >> feeds.conf.default
          echo "src-git small https://github.com/kenzok8/small" >> feeds.conf.default
          ./scripts/feeds update -a
          # 精准去重：仅删除可能导致重复定义的界面包
          rm -rf feeds/luci/applications/luci-app-mosdns
          rm -rf feeds/luci/themes/luci-theme-argon
          ./scripts/feeds install -a

      - name: 4. PCIe 2.0s Timeout Patch
        run: |
          cd openwrt
          find target/linux/rockchip -name "pcie-rockchip-host.c" -exec sed -i 's/500 \* USEC_PER_MSEC/2000 \* USEC_PER_MSEC/g' {} +
          find target/linux/rockchip -name "pcie-rockchip-host.c" -exec sed -i 's/RK_PCIE_LINK_UP_TIMEOUT_MS	500/RK_PCIE_LINK_UP_TIMEOUT_MS	2000/g' {} +

      - name: 5. Inject EMB-3531 DTS
        run: |
          cd openwrt
          mkdir -p target/linux/rockchip/files/arch/arm64/boot/dts/rockchip/
          cat > target/linux/rockchip/files/arch/arm64/boot/dts/rockchip/rk3399-emb-3531.dts <<EOF
          /dts-v1/;
          #include "rk3399-nanopi-r4s.dts"
          / {
              model = "Norco EMB-3531 SideGateway";
              compatible = "rockchip,rk3399-emb-3531", "rockchip,rk3399";
              vcc3v3_pcie: vcc3v3-pcie-regulator {
                  compatible = "regulator-fixed";
                  enable-active-high;
                  gpio = <&gpio1 17 0>; 
                  regulator-name = "vcc3v3_pcie";
                  regulator-always-on;
                  regulator-boot-on;
              };
          };
          &pcie0 {
              ep-gpios = <&gpio4 25 0>; 
              vpcie3v3-supply = <&vcc3v3_pcie>;
              status = "okay";
          };
          EOF
          [ -f target/linux/rockchip/image/armv8.mk ] && sed -i '/rk3399-nanopi-r4s/a \	rk3399-emb-3531.dtb \\' target/linux/rockchip/image/armv8.mk

      - name: 6. SideGateway Setup (IP 1.88)
        run: |
          cd openwrt
          mkdir -p package/base-files/files/etc/uci-defaults
          cat > package/base-files/files/etc/uci-defaults/99-setup <<EOF
          uci set network.lan.proto='static'
          uci set network.lan.ipaddr='192.168.1.88'
          uci set network.lan.netmask='255.255.255.0'
          uci set network.lan.gateway='192.168.1.1'
          uci set network.lan.dns='192.168.1.1'
          uci set dhcp.lan.ignore='1'
          uci set firewall.@defaults[0].forward='ACCEPT'
          echo "net.bridge.bridge-nf-call-iptables = 0" >> /etc/sysctl.conf
          uci commit
          EOF

      - name: 7. Final Configuration Setup (Solve Conflicts)
        run: |
          cd openwrt
          echo "CONFIG_TARGET_rockchip=y" >> .config
          echo "CONFIG_TARGET_rockchip_armv8=y" >> .config
          echo "CONFIG_TARGET_rockchip_armv8_DEVICE_rockchip_firefly-rk3399=y" >> .config
          
          # 核心插件：显式开启 mosdns 及其界面
          echo "CONFIG_PACKAGE_mosdns=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-mosdns=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-daed=y" >> .config
          echo "CONFIG_PACKAGE_luci-theme-argon=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-ttyd=y" >> .config
          
          # 【冲突修复】：不选冲突的 geoip/geosite，改选统一的 geodata 解决 APK 报错
          echo "# CONFIG_PACKAGE_v2ray-geoip is not set" >> .config
          echo "# CONFIG_PACKAGE_v2ray-geosite is not set" >> .config
          echo "CONFIG_PACKAGE_v2ray-geodata=y" >> .config
          
          # 分区空间与 BTF
          echo "CONFIG_TARGET_KERNEL_PARTSIZE=128" >> .config
          echo "CONFIG_TARGET_ROOTFS_PARTSIZE=2048" >> .config
          echo "CONFIG_KERNEL_DEBUG_INFO_BTF=y" >> .config
          echo "CONFIG_BPF_SYSCALL=y" >> .config
          echo "CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT=y" >> .config
          
          make defconfig

      - name: 8. Start Compilation
        id: compile
        run: |
          cd openwrt
          make download -j16
          make -j$(nproc) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 9. Upload Release
        uses: softprops/action-gh-release@v1
        if: steps.compile.outputs.status == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: EMB-3531-STABLE-${{ github.run_id }}
          body: |
            已解决 APK 包管理器冲突和 MosDNS 依赖缺失问题。
          files: openwrt/bin/targets/rockchip/armv8/*.img.gz
