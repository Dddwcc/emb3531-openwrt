name: EMB-3531-DAE-Final

on:
  repository_dispatch:
  workflow_dispatch:

permissions: write-all

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 检查分支
      uses: actions/checkout@main

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        # 补充 dwarves (pahole) 用于 BTF 编译
        sudo -E apt-get -qq install $(curl -fsSL https://is.gd/depends_ubuntu_2204) dwarves
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$USER /workdir

    - name: 下载源码
      working-directory: /workdir
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 加载自定义 feeds
      run: |
        cd openwrt
        echo "src-git kenzo https://github.com/kenzok8/openwrt-packages" >> feeds.conf.default
        echo "src-git small https://github.com/kenzok8/small" >> feeds.conf.default
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 加载自定义配置 (旁路由+dae优化)
      run: |
        cd openwrt
        
        # 1. 指定硬件架构
        echo "CONFIG_TARGET_rockchip=y" >> .config
        echo "CONFIG_TARGET_rockchip_armv8=y" >> .config
        echo "CONFIG_TARGET_rockchip_armv8_DEVICE_firefly_rk3399=y" >> .config
        
        # 2. 核心插件集成
        echo "CONFIG_PACKAGE_luci-app-daed=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-mosdns=y" >> .config
        echo "CONFIG_PACKAGE_luci-theme-argon=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-ttyd=y" >> .config
        
        # 3. 开启 eBPF/dae 必须的内核参数
        echo "CONFIG_KERNEL_BPF_EVENTS=y" >> .config
        echo "CONFIG_KERNEL_DEBUG_INFO=y" >> .config
        echo "CONFIG_KERNEL_DEBUG_INFO_BTF=y" >> .config
        echo "CONFIG_BPF_SYSCALL=y" >> .config
        echo "CONFIG_NET_CLS_BPF=y" >> .config
        echo "CONFIG_NET_ACT_BPF=y" >> .config
        
        # 4. 旁路由自动化脚本: 静态IP 1.88 / 禁用DHCP / 优化转发
        mkdir -p package/base-files/files/etc/uci-defaults
        cat > package/base-files/files/etc/uci-defaults/99-side-gateway <<EOF
        # 基础网络设置
        uci set network.lan.proto='static'
        uci set network.lan.ipaddr='192.168.1.88'
        uci set network.lan.netmask='255.255.255.0'
        uci set network.lan.gateway='192.168.1.1'
        uci set network.lan.dns='192.168.1.1'
        
        # 禁用旁路由 DHCP
        uci set dhcp.lan.ignore='1'
        
        # 禁用 IPv6 (可选，增加旁路由稳定性)
        uci set network.lan.ipv6='off'
        
        # 关键：禁用网桥过滤，确保流量转发不受阻
        echo "net.bridge.bridge-nf-call-ip6tables = 0" >> /etc/sysctl.conf
        echo "net.bridge.bridge-nf-call-iptables = 0" >> /etc/sysctl.conf
        echo "net.bridge.bridge-nf-call-arptables = 0" >> /etc/sysctl.conf
        
        # 默认 UI 设置
        uci set luci.main.mediaurlbase='/luci-static/argon'
        uci commit
        EOF

        # 5. 修正 Argon 默认主题
        sed -i 's/luci-theme-bootstrap/luci-theme-argon/g' feeds/luci/collections/luci/Makefile

        make defconfig

    - name: 下载软件包
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译固件
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 整理编译文件
      id: organize
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 发布至 Release
      uses: softprops/action-gh-release@v1
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: EMB-3531-SideGateway-${{ github.run_id }}
        body: |
          ### EMB-3531 (RK3399) 旁路由专用固件
          - **管理地址**: 192.168.1.88
          - **默认网关**: 192.168.1.1
          - **DHCP**: 已自动禁用
          - **核心功能**: 集成 dae (eBPF) + MosDNS + Argon 主题
          - **内核特性**: 已开启 BTF，完美支持 dae 透明代理
        files: ${{ env.FIRMWARE_PATH }}/*
