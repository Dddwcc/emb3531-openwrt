name: EMB-3531-DAE-SideGateway

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: '是否开启SSH远程调试? (true/false)'
        required: false
        default: 'false'

permissions: write-all

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 检查分支
      uses: actions/checkout@main

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL https://is.gd/depends_ubuntu_2204)
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$USER /workdir

    - name: 下载源码
      working-directory: /workdir
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 加载自定义 feeds
      run: |
        cd openwrt
        echo "src-git kenzo https://github.com/kenzok8/openwrt-packages" >> feeds.conf.default
        echo "src-git small https://github.com/kenzok8/small" >> feeds.conf.default
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 加载自定义配置 (旁路由专版)
      run: |
        cd openwrt
        
        # 1. 硬件配置 (RK3399)
        echo "CONFIG_TARGET_rockchip=y" >> .config
        echo "CONFIG_TARGET_rockchip_armv8=y" >> .config
        echo "CONFIG_TARGET_rockchip_armv8_DEVICE_firefly_rk3399=y" >> .config
        
        # 2. 核心插件 (dae + mosdns + argon)
        echo "CONFIG_PACKAGE_luci-app-daed=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-mosdns=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-ttyd=y" >> .config
        echo "CONFIG_PACKAGE_luci-theme-argon=y" >> .config
        
        # 3. 内核 BTF 支持 (dae 运行必备)
        echo "CONFIG_KERNEL_BPF_EVENTS=y" >> .config
        echo "CONFIG_KERNEL_DEBUG_INFO=y" >> .config
        echo "CONFIG_KERNEL_DEBUG_INFO_BTF=y" >> .config
        echo "CONFIG_BPF_SYSCALL=y" >> .config

        # 4. 创建自动配置脚本 (刷机即用核心逻辑)
        mkdir -p package/base-files/files/etc/uci-defaults
        cat > package/base-files/files/etc/uci-defaults/99-side-gateway-setup <<EOF
        # 设置 LAN 口 IP、网关和 DNS
        uci set network.lan.proto='static'
        uci set network.lan.ipaddr='192.168.1.88'
        uci set network.lan.netmask='255.255.255.0'
        uci set network.lan.gateway='192.168.1.1'
        uci set network.lan.dns='192.168.1.1'
        
        # 关闭 LAN 口 DHCP (旁路由模式)
        uci set dhcp.lan.ignore='1'
        
        # 优化防火墙 (旁路由流量分流)
        uci set firewall.@defaults[0].forward='ACCEPT'
        
        # 设置默认主题
        uci set luci.main.mediaurlbase='/luci-static/argon'
        
        uci commit
        EOF

        make defconfig

    - name: 下载软件包
      id: package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译固件
      id: compile
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 整理编译文件
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上传固件目录
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_SideGateway_1.88
        path: ${{ env.FIRMWARE }}

    - name: 发布至 Release
      uses: softprops/action-gh-release@v1
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: SideGateway-RK3399-${{ github.run_id }}
        body: |
          EMB-3531 (RK3399) 旁路由定制版
          - 预设 IP: 192.168.1.88
          - 预设网关: 192.168.1.1
          - DHCP: 已关闭
          - 插件: daed, MosDNS, Argon
          - 内核: 已开启 BTF 支持 (dae 兼容)
        files: ${{ env.FIRMWARE }}/*
