name: RK3399-DAE-Final-Build

在:
工作流触发:

权限: 全部写入

环境:
  REPO_URL: https://github.com/coolsnowwolf/lede
仓库分支: master
时区: 亚洲/上海

作业:
构建:
    runs-on: ubuntu-22.04

    steps:
    - name: 1. 检出代码
      uses: actions/checkout@v3

    - name: 2. 彻底清理磁盘空间
运行: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup
        sudo docker image prune -a -f
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL https://is.gd/depends_ubuntu_2204) dwarves
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

    - name: 3. 克隆源码并清洗冲突插件
运行: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt
        echo "src-git kenzo https://github.com/kenzok8/openwrt-packages" >> feeds.conf.default
        echo "src-git small https://github.com/kenzok8/small" >> feeds.conf.default
        
        ./scripts/feeds update -a
        
        # 强制删除官方源中重名的包，防止 Error 2
        rm -rf feeds/luci/applications/luci-app-mosdns
        rm -rf feeds/packages/net/mosdns
        rm -rf feeds/packages/net/v2ray-geodata
        rm -rf feeds/luci/themes/luci-theme-argon
        
        ./scripts/feeds install -a

    - name: 4. 写入硬件配置与旁路由脚本
运行: |
        cd openwrt
        # Firefly RK3399 硬件设定
        echo "CONFIG_TARGET_rockchip=y" >> .config
        echo "CONFIG_TARGET_rockchip_armv8=y" >> .config
        echo "CONFIG_TARGET_rockchip_armv8_DEVICE_firefly-rk3399=y" >> .config
        
        # 插件设定
        echo "CONFIG_PACKAGE_luci-app-daed=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-mosdns=y" >> .config
        echo "CONFIG_PACKAGE_luci-theme-argon=y" >> .config
        
        # 内核 BTF 支持 (dae 运行必备)
        sed -i 's/# CONFIG_KERNEL_DEBUG_INFO_BTF is not set/CONFIG_KERNEL_DEBUG_INFO_BTF=y/g' .config
        echo "CONFIG_KERNEL_BPF_EVENTS=y" >> .config
        echo "CONFIG_KERNEL_DEBUG_INFO=y" >> .config
        echo "CONFIG_KERNEL_DEBUG_INFO_BTF=y" >> .config
        echo "CONFIG_BPF_SYSCALL=y" >> .config

        # 旁路由默认 IP: 192.168.1.88
        mkdir -p package/base-files/files/etc/uci-defaults
        cat > package/base-files/files/etc/uci-defaults/99-setup <<EOF
        uci set network.lan.proto='static'
        uci set network.lan.ipaddr='192.168.1.88'
        uci set network.lan.netmask='255.255.255.0'
        uci set network.lan.gateway='192.168.1.1'
        uci set network.lan.dns='192.168.1.1'
        uci set dhcp.lan.ignore='1'
        uci commit
        EOF

        make defconfig

    - name: 5. 下载编译包
运行: |
        cd openwrt
        make download -j16
        find dl -size -1k -exec rm -f {} \;

    - name: 6. 编译固件 (约 1-2 小时)
id: 编译
运行: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

- 名称：7. 整理固件
如果: steps.compile.outputs.status =='成功'
      run: |
        cd openwrt/bin/targets/rockchip/armv8
        rm -rf packages
        echo "FIRMWARE_DIR=$PWD" >> $GITHUB_ENV

    - name: 8. 发布到 Release
使用: softprops/action-gh-release@v1
如果: env.FIRMWARE_DIR !=''
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
与:
RK3399-DAE-$github.run_id}
文件: ${{env.FIRMWARE_DIR}
